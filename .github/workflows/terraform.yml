name: Terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.13.4
  TF_IN_AUTOMATION: '1'

jobs:
  static:
    name: fmt, validate, lint, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive -diff infra

      # -backend=false: validation needs providers, not state or AWS credentials, so this
      # job runs on every PR including ones from forks.
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: Lint
        working-directory: infra
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      # Failures block the PR. Accepted risks are skipped inline next to the resource,
      # each with a reason, so the exception is reviewed in the same diff as the code.
      - name: Security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: plan (dev)
    needs: static
    # Skipped until infra/bootstrap has been applied and the repository variables set.
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for short-lived AWS credentials; no stored keys
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper copies command output into the step log; this job must control it.
          terraform_wrapper: false

      # Logs and job summaries of a public repository are world-readable, so the full plan
      # (ARNs, account ID, endpoints) must never reach them. Mask the account ID, keep the
      # plan in a file on the runner, and publish only action + resource address.
      - name: Mask account ID
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account_id}"

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
          > /dev/null

      # The plan role is read-only, so this cannot change anything even if the PR edits
      # the Terraform to try. The tag is the PR head commit; the image need not exist yet.
      # Output is discarded: a failure here prints only a pointer, not provider errors.
      - name: Plan
        run: |
          if ! terraform plan -input=false -no-color \
              -var "image_tag=${{ github.event.pull_request.head.sha }}" \
              -out=tfplan > plan.txt 2>&1; then
            echo "::error::terraform plan failed. Output is withheld because this repository is public; reproduce locally with the plan role."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo '### Plan: changed resources (addresses only)'
            echo '```'
            terraform show -json tfplan \
              | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' \
              | sort | head -n 200
            echo '```'
            echo 'Full plan: run `terraform plan` locally; it is not published here.'
          } >> "$GITHUB_STEP_SUMMARY"
